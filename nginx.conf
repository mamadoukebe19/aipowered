##############################################################
#  Nginx site config for the CI/CD Demo App
#  File location on EC2: /etc/nginx/sites-available/demo-app
##############################################################

server {
    listen 80;
    server_name YOUR_EC2_PUBLIC_IP;   # ← replace with your EC2 IP or domain

    root /var/www/demo-app;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Optional: Serve a custom 404 page
    error_page 404 /index.html;

    # Gzip compression for faster delivery
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets for 7 days
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
