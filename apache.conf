##############################################################
#  Apache Virtual Host config for the CI/CD Demo App
#  File location on EC2: /etc/apache2/sites-available/demo-app.conf
#  (for reference — the default config already serves /var/www/html)
##############################################################

<VirtualHost *:80>
    ServerName 3.231.225.158   # ← replace with your EC2 IP or domain

    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Custom error page
    ErrorDocument 404 /index.html

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/demo-app-error.log
    CustomLog ${APACHE_LOG_DIR}/demo-app-access.log combined
</VirtualHost>
