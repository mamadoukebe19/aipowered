name: Deploy HTML/CSS to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy static website
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}

        run: |

          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          echo "Testing SSH connection..."

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i private_key.pem \
            ${USER}@${HOST} \
            "echo 'SSH connection successful'"

          echo "Deploying website..."

          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            ${USER}@${HOST} << 'EOF'

            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            REPO_DIR="/var/www/html"

            cd "$REPO_DIR"

            echo "Updating repository..."

            sudo git fetch origin
            sudo git reset --hard origin/main

            echo "Latest commit:"
            sudo git log -1 --oneline

            echo "Setting permissions..."

            sudo chown -R www-data:www-data "$REPO_DIR"
            sudo chmod -R 755 "$REPO_DIR"

            echo "Testing Apache configuration..."

            sudo apachectl configtest

            echo "Restarting Apache..."

            sudo systemctl restart apache2

            echo "Checking Apache..."

            sudo systemctl is-active --quiet apache2

            echo "Testing website..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
                echo "ERROR: Website returned HTTP $HTTP_STATUS"
                exit 1
            fi

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

            echo "Website files:"
            ls -lah "$REPO_DIR"

          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f private_key.pem
