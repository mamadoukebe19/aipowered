name: Deploy HTML CSS to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy static website to EC2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}

        run: |

          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          echo "Testing SSH connection..."

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i private_key.pem \
            ${USER}@${HOST} \
            "echo 'SSH connection successful'"

          echo "Deploying website..."

          ssh \
            -o StrictHostKeyChecking=no \
            -i private_key.pem \
            ${USER}@${HOST} << 'EOF'

            set -e

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            REPO_URL="https://github.com/mamadoukebe19/aipowered.git"
            WEB_DIR="/var/www/html"

            echo "Installing required packages..."

            sudo apt update -y
            sudo apt install -y apache2 git

            echo "Creating Apache web directory..."

            sudo mkdir -p "$WEB_DIR"

            echo "Checking repository..."

            if [ ! -d "$WEB_DIR/.git" ]; then

                echo "Repository does not exist."
                echo "Cloning repository..."

                sudo rm -rf "$WEB_DIR"

                sudo git clone "$REPO_URL" "$WEB_DIR"

            else

                echo "Repository already exists."
                echo "Updating repository..."

                cd "$WEB_DIR"

                sudo git fetch origin
                sudo git reset --hard origin/main

            fi

            echo ""
            echo "======================================"
            echo "Repository status"
            echo "======================================"

            cd "$WEB_DIR"

            sudo git log -1 --oneline

            echo ""
            echo "Website files:"
            ls -lah "$WEB_DIR"

            echo ""
            echo "======================================"
            echo "Configuring permissions"
            echo "======================================"

            sudo chown -R www-data:www-data "$WEB_DIR"
            sudo chmod -R 755 "$WEB_DIR"

            echo ""
            echo "======================================"
            echo "Configuring Apache"
            echo "======================================"

            sudo systemctl enable apache2

            sudo apachectl configtest

            sudo systemctl restart apache2

            echo ""
            echo "Apache status:"

            sudo systemctl is-active apache2

            echo ""
            echo "======================================"
            echo "Testing website"
            echo "======================================"

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)

            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" != "200" ]; then
                echo "ERROR: Website returned HTTP $HTTP_STATUS"
                exit 1
            fi

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"

          EOF

      - name: Cleanup
        if: always()
        run: |
          rm -f private_key.pem
