name: Deploy to EC2

# Trigger: Run workflow on every push to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Amazon EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Deploy to EC2 using SSH
      - name: Deploy to EC2 via SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          # Save the private key to a temp file
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # SSH into EC2 and deploy
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << 'EOF'
            # Apache serves files from /var/www/html
            cd /var/www/html

            # Pull latest changes from GitHub
            git pull origin main

            # Restart Apache to pick up any changes
            sudo systemctl restart apache2

            echo "✅ Deployment successful!"
          EOF

      # Step 3: Always clean up the key file
      - name: Cleanup
        if: always()
        run: rm -f private_key.pem
